# Keep the on-chain denylist current with the sanctions-api feed.
#
# The demo screens a snapshot of sanctioned Ethereum addresses held in the
# PolicyClient's on-chain params. sanctions-api refreshes its data daily; this
# pushes any change in the Ethereum subset on-chain, so the demo tracks the
# feed without anyone running setparams by hand.
#
# It is deliberately cheap and safe:
#   - runs AFTER sanctions-api's own refresh, so it reads fresh data
#   - setparams.mjs skips the transaction when the list is unchanged, so most
#     days this spends no gas at all
#   - after any write it verifies a CLEAN address is Compliant and a SANCTIONED
#     one is Non Compliant, and fails the run if not — a bad params write turns
#     the policy into deny-everything, which looks identical to it working
#
# Secrets required (Settings → Secrets → Actions):
#   OWNER_PRIVATE_KEY      the PolicyClient owner key. ROTATE the one from
#                          deploy/.env before using it here — it was exposed.
#   POLICY_CLIENT_DENYLIST 0xfd054556b4d00d8b0f897b1ae377ecd17fccae78
#   SEPOLIA_RPC_URL        optional; defaults to a public endpoint
#   NEWTON_API_KEY         for the post-write verification submit

name: Refresh on-chain denylist

on:
  schedule:
    # 05:10 UTC — ~50 min after sanctions-api's 04:20 refresh, so its new
    # wallets.json has committed before we read it.
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  # Never let two refreshes race a setPolicy against the same client.
  group: refresh-onchain
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Secrets promoted to env so steps can gate on them. The on-chain write
    # needs the owner key — a transaction has to be signed, there is no way
    # around that — so when the key is absent the job still regenerates and
    # commits lib/ofac-full.ts (no secret required) and simply skips the write.
    # That keeps the repo's list current and the run green until the key is
    # armed. POLICY_CLIENT_DENYLIST is a public address, so it defaults here
    # rather than requiring a secret.
    env:
      OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
      POLICY_CLIENT_DENYLIST: ${{ secrets.POLICY_CLIENT_DENYLIST || '0xfd054556b4d00d8b0f897b1ae377ecd17fccae78' }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      NEWTON_API_KEY: ${{ secrets.NEWTON_API_KEY }}
    steps:
      - name: Checkout policy-builder
        uses: actions/checkout@v5
        with:
          path: policy-builder

      - name: Checkout sanctions-api (for the fresh wallet snapshot)
        uses: actions/checkout@v5
        with:
          repository: alazk/sanctions-api
          path: sanctions-api
          # If sanctions-api is private, add: token: ${{ secrets.REPO_READ_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        working-directory: policy-builder
        run: npm ci

      - name: Regenerate the Ethereum list from the feed
        # The script lives in policy-builder (scripts/emit-full-list.mjs) and
        # resolves the snapshot at ../../sanctions-api/wallets.json — the
        # sibling checkout above. Run it from policy-builder so it also writes
        # lib/ofac-full.ts back into this checkout.
        working-directory: policy-builder
        run: node scripts/emit-full-list.mjs

      - name: Push to on-chain params if changed
        # Skipped when no owner key is configured — see the job-level note.
        if: ${{ env.OWNER_PRIVATE_KEY != '' }}
        working-directory: policy-builder
        run: node policy/setparams.mjs --confirm

      - name: Note the skipped on-chain write
        if: ${{ env.OWNER_PRIVATE_KEY == '' }}
        run: echo "OWNER_PRIVATE_KEY not set — regenerated the list but skipped the on-chain write. Add the (rotated) key as a secret to arm it."

      - name: Verify the live site still screens correctly
        # Only meaningful after a write; also needs the site's own env. Skipped
        # in refresh-only mode so a missing key does not fail the run.
        if: ${{ env.OWNER_PRIVATE_KEY != '' }}
        env:
          # A clean address and a known-sanctioned one from the pool.
          CLEAN: "0x1111111111111111111111111111111111111111"
          DIRTY: "0x175d44451403edf28469df03a9280c1197adb92c"
        run: |
          set -e
          cat > /tmp/verdict.py <<'PY'
          import sys, json
          r = json.load(sys.stdin).get("result") or {}
          e = r.get("error")
          if e:
              print(e)
          else:
              ev = (r.get("task_response") or {}).get("evaluation_result") or []
              print("DENIED" if ev and ev[-1] == 0 else "ALLOWED")
          PY
          submit() {
            curl -sS -X POST https://newton-policy-builder.vercel.app/api/evaluate \
              -H 'content-type: application/json' \
              -d "{\"mode\":\"submit\",\"providerId\":\"local-denylist\",\"to\":\"$1\"}" \
              | python3 /tmp/verdict.py
          }
          clean=$(submit "$CLEAN");  echo "clean:      $clean"
          sleep 20
          dirty=$(submit "$DIRTY");  echo "sanctioned: $dirty"
          if [ "$clean" != "ALLOWED" ] || [ "$dirty" != "DENIED" ]; then
            echo "::error::screening verification failed — clean=$clean sanctioned=$dirty"
            exit 1
          fi

      - name: Commit the regenerated list
        working-directory: policy-builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet lib/ofac-full.ts; then
            echo "no list change"
          else
            git add lib/ofac-full.ts
            git commit -m "Refresh on-chain denylist from sanctions-api ($(date -u +%Y-%m-%d))"
            git push
          fi
